<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駐點人員回報系統</title>
    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0071e3;
            --primary-hover: #0077ed;
            --secondary: #86868b;
            --accent: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --bg: #fbfbfd;
            --card-bg: #ffffff;
            --border: #d2d2d7;
        }
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 30px 0 40px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.004em;
            color: var(--text);
        }

        .header-title {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .app-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            color: var(--primary);
            background: rgba(0,113,227,0.09);
            border: 1px solid rgba(0,113,227,0.16);
            box-shadow: 0 6px 18px rgba(0,113,227,0.10);
            flex: 0 0 auto;
        }
        
        .header .user-info {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 12px;
            font-weight: 400;
        }

        .user-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .user-meta-divider {
            width: 1px;
            height: 14px;
            background: rgba(134,134,139,0.42);
        }

        .user-icon {
            width: 16px;
            height: 16px;
            color: var(--primary);
            stroke-width: 2;
            flex: 0 0 auto;
        }
        
        .card {
            background: var(--card-bg);
            border: none;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        
        .card-title {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -0.012em;
            margin-bottom: 20px;
            color: var(--text);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 17px;
            transition: all 0.2s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
        }
            color: #1f2937;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        select option {
            background: #ffffff;
            color: #1f2937;
        }
        
        .btn {
            padding: 18px 24px;
            border: none;
            border-radius: 980px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            font-family: 'Poppins', -apple-system, sans-serif;
        }
        
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        
        .btn-secondary {
            background: rgba(0,0,0,0.05);
            color: var(--primary);
        }
        
        .btn-secondary:hover {
            background: rgba(0,0,0,0.1);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }
        
        .product-search {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .product-search input {
            flex: 1;
        }
        
        .product-search .btn {
            width: auto;
            padding: 12px 16px;
        }
        
        .scanner-container {
            display: none;
            margin-bottom: 15px;
        }
        
        .scanner-container.active {
            display: block;
        }
        
        #scanner-wrapper {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        
        #reader {
            width: 100%;
        }
        
        .scanner-close {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(255,107,107,0.2);
            border: none;
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 8px;
        }
        
        .product-info {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }
        
        .product-info.show {
            display: block;
        }
        
        .product-info h4 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .product-info .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }
        
        .product-info .info-row:last-child {
            border-bottom: none;
        }
        
        .product-info .info-label {
            color: #6b7280;
        }
        
        .product-info .info-value {
            color: #1f2937;
            font-weight: 500;
        }
        
        #reportForm {
            display: none;
        }
        
        #reportForm.active {
            display: block;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .result-message {
            text-align: center;
            padding: 30px;
        }
        
        .result-message .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .result-message h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #1f2937;
        }
        
        .result-message p {
            color: #6b7280;
            font-size: 14px;
        }
        
        .history-item {
            background: #f9fafb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
        }
        
        .history-item .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0;
            margin-bottom: 8px;
        }
        
        .history-item .pn {
            font-weight: 600;
            color: var(--primary);
        }
        
        .history-item .time {
            font-size: 12px;
            color: #6b7280;
        }
        
        .history-item .note {
            font-size: 13px;
            color: #6b7280;
        }
        
        .logout-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: var(--danger);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .hidden { display: none !important; }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0,168,232,0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">登出</button>
    
    <div class="container">
        <div class="header">
            <h1 class="header-title">
                <span class="app-icon" aria-hidden="true">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 3h6"></path>
                        <path d="M9 3a2 2 0 0 0-2 2v1h10V5a2 2 0 0 0-2-2"></path>
                        <path d="M7 6H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2"></path>
                        <path d="M8 12h8"></path>
                        <path d="M8 16h5"></path>
                    </svg>
                </span>
                <span>駐點人員回報系統</span>
            </h1>
            <div class="user-info hidden" id="userInfo">
                <span class="user-meta-item">
                    <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span id="displayName"></span>
                </span>
                <span class="user-meta-divider" aria-hidden="true"></span>
                <span class="user-meta-item">
                    <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 21h18"></path>
                        <path d="M5 21V7l8-4v18"></path>
                        <path d="M19 21V11l-6-4"></path>
                        <path d="M9 9v.01"></path>
                        <path d="M9 13v.01"></path>
                        <path d="M9 17v.01"></path>
                    </svg>
                    <span id="displayStore"></span>
                </span>
            </div>
        </div>
        
        <!-- Login Form -->
        <div class="card" id="loginForm">
            <div class="card-title">
                Please Login
            </div>
            
            <div class="form-group">
                <label>姓名 Name</label>
                <input type="text" id="loginName" placeholder="請輸入您的姓名" maxlength="100">
            </div>
            
            <div class="form-group">
                <label>店名 Store</label>
                <select id="loginStore">
                    <option value="">載入中...</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="login()">
                Login 登入
            </button>
        </div>
        
        <!-- Report Form -->
        <div class="card" id="reportForm">
            <!-- Daily Sales Summary -->
            <div id="dailySales" style="display:none;background:linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);border-radius:12px;padding:15px;margin-bottom:15px;text-align:center;color:#fff;">
                <div id="storeAverageBlock" style="display:none;border-bottom:1px solid rgba(255,255,255,0.28);padding-bottom:10px;margin-bottom:10px;">
                    <div style="font-size:12px;opacity:0.9;" id="storeTargetLabel">門市平均業績 Store Average/日</div>
                    <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
                        <div style="font-size:22px;font-weight:900;" id="storeAverageAmount">$0</div>
                        <button type="button" id="adminTargetEditBtn" onclick="editAdminDailyTarget()" aria-label="更新目標" style="display:none;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid rgba(255,255,255,0.34);border-radius:50%;background:rgba(255,255,255,0.14);color:#fff;cursor:pointer;padding:0;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div style="font-size:12px;opacity:0.9;">當日營業額 Cumulative Sales</div>
                <div style="display:flex;align-items:flex-end;justify-content:center;gap:14px;">
                    <div style="font-size:28px;font-weight:900;" id="totalSalesAmount">$0</div>
                    <div style="text-align:left;padding-bottom:3px;">
                        <div style="font-size:10px;opacity:0.78;">達成率</div>
                        <div style="font-size:15px;font-weight:800;line-height:1.1;" id="achievementRate">--</div>
                    </div>
                </div>
                <div style="font-size:12px;opacity:0.8;" id="totalSalesCount">0筆成交</div>
                <div id="dailyRewardBlock" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.22);">
                    <div style="font-size:12px;opacity:0.9;">今日台獎 Incentive</div>
                    <div style="font-size:22px;font-weight:900;" id="dailyRewardAmount">$0</div>
                </div>
            </div>
            
            <div class="card-title" id="productReportTitle">
                Product Report 產品回報
            </div>
            
            <!-- Product Report Section -->
            <div id="productReportSection">
            
            <!-- Barcode Scanner -->
            <div class="scanner-container" id="scannerContainer">
                <div id="scanner-wrapper">
                    <div id="reader"></div>
                </div>
                <button class="scanner-close" onclick="stopScanner()">關閉掃描器</button>
            </div>
            
            <!-- Product Search -->
            <div class="form-group">
                <label>產品 PN 碼</label>
                <input type="text" id="productPN" placeholder="請輸入 PN 碼" oninput="searchProductsRealTime()">
                
                <!-- Real-time Search Results -->
                <div id="searchResults" style="display:none;max-height:200px;overflow-y:auto;background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-top:5px;"></div>
                
                <button class="btn btn-secondary" style="margin-top:8px;width:100%" onclick="showAllProducts()">
                    顯示全部產品
                </button>
                
                <!-- All Products List -->
                <div id="allProducts" style="display:none;max-height:250px;overflow-y:auto;background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-top:10px;padding:10px;"></div>
            </div>
            
            <!-- Product Info -->
            <div class="product-info" id="productInfo">
                <h4>Product Info 產品資訊</h4>
                <div class="info-row">
                    <span class="info-label">PN 碼</span>
                    <span class="info-value" id="infoPN">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">產品名稱</span>
                    <span class="info-value" id="infoName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">規格</span>
                    <span class="info-value" id="infoSpec">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">類別</span>
                    <span class="info-value" id="infoCategory">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">價格</span>
                    <span class="info-value" id="infoPrice">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">台獎</span>
                    <span class="info-value" id="infoReward">-</span>
                </div>
            </div>
            
            <!-- Report Details -->
            <div class="form-group">
                <label>備註說明</label>
                <textarea id="reportNote" placeholder="請輸入任何需要記錄的事項..."></textarea>
            </div>
            
            <button class="btn btn-primary" id="submitReportBtn" onclick="submitReport()">
                Submit 提交回報
            </button>
            
            </div>
            
            <!-- History -->
            <div style="margin-top: 20px;">
                <div class="card-title">
                    Today's Records 今日回報記錄
                </div>
                <div id="historyList">
                    <p style="text-align:center;color:#666;font-size:13px;">尚無回報記錄 No records yet</p>
                </div>
            </div>
        </div>
        
        <!-- Success Result -->
        <div class="card hidden" id="successResult">
            <div class="result-message">
                <div class="icon" style="font-size:48px;">&#10004;</div>
                <h3>Success! 回報成功！</h3>
                <p>您的回報已送出，感謝您的協助！</p>
                <button class="btn btn-primary" style="margin-top:20px" onclick="resetForm()">
                    Continue 繼續回報
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== Configuration ====================
        const GOOGLE_SHEETS_CONFIG = {
            productsUrl: '/api/products',
            storesUrl: '/api/stores',
            reportsUrl: '/api/reports',
            deleteReportUrl: '/api/reports/delete',
            // Use demo mode - set to true only for testing
            useDemoMode: false
        };
        
        // Demo product data
        const demoProducts = [
            { pn: 'PN001', name: 'iPhone 15 Pro', spec: '256GB', category: '手機' },
            { pn: 'PN002', name: 'MacBook Air M3', spec: '13吋', category: '筆電' },
            { pn: 'PN003', name: 'AirPods Pro 2', spec: 'USB-C', category: '耳機' },
            { pn: 'PN004', name: 'iPad Pro 12.9', spec: '256GB', category: '平板' },
            { pn: 'PN005', name: 'Apple Watch S9', spec: '45mm', category: '手錶' },
            { pn: 'PN006', name: 'Samsung S24 Ultra', spec: '512GB', category: '手機' },
            { pn: 'PN007', name: 'Sony WH-1000XM5', spec: '旗艦款', category: '耳機' },
            { pn: 'PN008', name: 'Dell XPS 15', spec: 'i7/32GB', category: '筆電' },
            { pn: 'PN009', name: 'Nintendo Switch', spec: 'OLED', category: '遊戲機' },
            { pn: 'PN010', name: 'PS5', spec: '光碟版', category: '遊戲機' }
        ];
        
        // ==================== State ====================
        let currentUser = null;
        let html5QrCode = null;
        let selectedProduct = null;
        let reportHistory = [];
        let productsCache = [];
        let isSubmittingReport = false;
        const ADMIN_DAILY_TARGET_KEY = 'staffReport_adminDailyTarget';
        const DEFAULT_ADMIN_DAILY_TARGET = 1500000;
        // 送出失敗時保留同一個回報 ID，重送時後端用它判斷是否已寫入，避免重複計入
        let pendingReport = null;
        const PENDING_REPORT_KEY = 'staffReport_pending';

        // 待確認的回報同步存進 sessionStorage（綁定姓名與門市），重新整理頁面後仍能沿用原 ID
        function setPendingReport(report) {
            pendingReport = report;
            try {
                if (report) {
                    sessionStorage.setItem(PENDING_REPORT_KEY, JSON.stringify({
                        name: report.userName, store: report.storeName, report
                    }));
                } else {
                    sessionStorage.removeItem(PENDING_REPORT_KEY);
                }
            } catch (storageErr) {
                console.warn('Pending report save failed:', storageErr);
            }
        }

        function restorePendingReport() {
            try {
                const raw = sessionStorage.getItem(PENDING_REPORT_KEY);
                if (!raw || !currentUser) return;
                const saved = JSON.parse(raw);
                const report = saved && saved.report;
                const valid = report && typeof report === 'object' && typeof report.id === 'string'
                    && typeof report.taipeiDate === 'string' && typeof report.productPN === 'string';
                if (valid && saved.name === currentUser.name && saved.store === currentUser.store) {
                    pendingReport = report;
                }
            } catch (storageErr) {
                console.warn('Pending report restore failed:', storageErr);
            }
        }
        // 本次開啟頁面後確認送出成功的回報；伺服器清單還沒讀回前先補進畫面
        let sessionSavedReports = [];
        let dailySalesRequestSeq = 0;
        let dailySalesAppliedSeq = 0;

        // 所有來自 Sheet 或使用者輸入的文字，插入 HTML 前都要經過這個函式
        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function makeReportId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }
            return `${Date.now()}-${Math.random().toString(36).slice(2, 11)}`;
        }

        // ==================== Initialization ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 產品清單與刪除按鈕改用事件委派，不再把資料塞進行內 onclick
            ['searchResults', 'allProducts'].forEach(id => {
                document.getElementById(id).addEventListener('click', event => {
                    const item = event.target.closest('[data-pn]');
                    if (item) selectProduct(item.dataset.pn);
                });
            });
            document.getElementById('historyList').addEventListener('click', event => {
                const btn = event.target.closest('button[data-report-id]');
                if (btn) deleteReportById(btn.dataset.reportId, btn.dataset.name, btn.dataset.store);
            });

            checkLoginStatus();
            loadStores(); // 載入門市清單
            loadProductsFromSheet().catch(err => console.log('Products load error:', err));
        });
        
        // 載入門市清單
        async function loadStores() {
            try {
                const response = await fetch(GOOGLE_SHEETS_CONFIG.storesUrl, { cache: 'no-store' });
                const stores = await response.json();
                
                const select = document.getElementById('loginStore');
                select.innerHTML = '<option value="">請選擇門市</option>';
                
                if (Array.isArray(stores)) {
                    stores.forEach(store => {
                        const option = document.createElement('option');
                        option.value = store;
                        option.textContent = store;
                        select.appendChild(option);
                    });
                }
                
            } catch (err) {
                console.log('Failed to load stores:', err);
            }
        }
        
        // ==================== Login ====================
        function login() {
            console.log('Login function called');
            const name = document.getElementById('loginName').value.trim();
            const store = document.getElementById('loginStore').value.trim();
            
            if (!name || !store) {

        // Admin 匯出功能 - 下載 Excel
        function toCsvCell(value) {
            let text = String(value || '');
            // 防 CSV 公式注入：以 = + - @ Tab CR 開頭的文字，前面加單引號讓 Excel 當成文字
            // 純數字（含負數）與單獨的「-」不處理，避免數字欄變文字
            const isPlainNumber = /^-?\d+(\.\d+)?$/.test(text);
            if (/^[=+\-@\t\r]/.test(text) && !isPlainNumber && text !== '-') {
                text = `'${text}`;
            }
            if (/[",\n\r]/.test(text)) {
                return `"${text.replace(/"/g, '""')}"`;
            }
            return text;
        }

        function getTaipeiDateString() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
            }).formatToParts(new Date());
            const values = Object.fromEntries(parts.filter(part => part.type !== 'literal').map(part => [part.type, part.value]));
            return `${values.year}-${values.month}-${values.day}`;
        }

        function syncToGoogleSheet() {
            if (!dailyReportsData || dailyReportsData.length === 0) {
                alert('沒有資料可匯出');
                return;
            }
            
            // 建立 CSV 內容（可以用 Excel 開啟）
            const headers = ['ID', '時間', '姓名', '店名', 'PN', '品名', '價格', '備註', '台獎'];
            let csv = headers.map(toCsvCell).join(',') + '\n';
            
            dailyReportsData.forEach(r => {
                const row = [
                    r.id || '',
                    r.time || '',
                    r.name || '',
                    r.store || '',
                    r.pn || '',
                    r.productName || '',
                    r.price || '',
                    r.note || '',
                    r.reward || '',
                ];
                csv += row.map(toCsvCell).join(',') + '\n';
            });
            
            // 建立 Blob 並下載
            const BOM = '\uFEFF'; // UTF-8 BOM
            const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `銷售報表_${getTaipeiDateString()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function clearAllReports() {
            if (!confirm('確定要清除今日銷售資料嗎？此操作無法復原！')) {
                return;
            }
            
            if (!dailyReportsData || dailyReportsData.length === 0) {
                alert('沒有資料可清除');
                return;
            }
            
            try {
                // 逐一刪除目前畫面載入的今日記錄
                for (const report of dailyReportsData) {

                        name: report.name || '',
                        store: report.store || ''

                    const response = await fetch(`${GOOGLE_SHEETS_CONFIG.deleteReportUrl}?${params.toString()}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);

                }

        // 已刪除的回報也要從本次補顯示清單與本機備援移除，否則會重新出現
        function forgetLocalReport(reportId) {
            const key = String(reportId);
            deletedReportIds.add(key);
            // 刪除前發出、還沒回來的讀取一律作廢，避免把刪掉的回報帶回畫面
            dailySalesAppliedSeq = dailySalesRequestSeq;
            // 刪除成功就先從畫面資料移除，不必等伺服器刷新成功
            dailyReportsData = dailyReportsData.filter(r => String(r.id) !== key);
            sessionSavedReports = sessionSavedReports.filter(r => String(r.id) !== key);
            reportHistory = reportHistory.filter(r => r && String(r.id) !== key);
            try {
                localStorage.setItem('staffReport_history', JSON.stringify(reportHistory.slice(0, 200)));
            } catch (storageErr) {
                console.warn('Local history save failed:', storageErr);
            }
            try {
                loadHistory();
            } catch (historyErr) {
                console.warn('History render failed:', historyErr);
            }
        }

        async function loadDailySales() {
            if (GOOGLE_SHEETS_CONFIG.useDemoMode) return;

            // 每次讀取編號；比較晚回來的舊回應直接丟棄，避免蓋掉較新的結果
            const requestSeq = ++dailySalesRequestSeq;
            const requestStartedAt = Date.now();
            
            try {
                let url;
                let data;
                
                if (currentUser && currentUser.isAdmin) {
                    // Admin: 讀取所有報告
                    url = `${GOOGLE_SHEETS_CONFIG.reportsUrl}?scope=all`;
                } else if (currentUser) {
                    // 一般用戶: 只讀取自己的報告
                    url = `${GOOGLE_SHEETS_CONFIG.reportsUrl}?name=${encodeURIComponent(currentUser.name)}&store=${encodeURIComponent(currentUser.store)}`;
                } else {
                    return;
                }
                
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                data = await response.json();
                if (requestSeq <= dailySalesAppliedSeq) return;
                dailySalesAppliedSeq = requestSeq;
                
                if (data.total !== undefined || data.totalSales !== undefined) {
                    document.getElementById('dailySales').style.display = 'block';
                    const totalAmount = data.total || data.totalSales || 0;
                    const rewardTotal = data.rewardTotal || 0;
                    const storeAverage = data.storeAverage && data.storeAverage.amount ? data.storeAverage.amount : 0;
                    const targetAmount = currentUser && currentUser.isAdmin ? getAdminDailyTarget() : storeAverage;
                    document.getElementById('totalSalesAmount').textContent = '$' + totalAmount.toLocaleString();
                    document.getElementById('totalSalesCount').textContent = data.count + '筆成交';
                    document.getElementById('dailyRewardAmount').textContent = '$' + rewardTotal.toLocaleString();
                    document.getElementById('achievementRate').textContent = targetAmount
                        ? ((totalAmount / targetAmount) * 100).toFixed(1).replace('.0', '') + '%'
                        : '--';

                    const storeAverageBlock = document.getElementById('storeAverageBlock');
                    const storeAverageAmount = document.getElementById('storeAverageAmount');
                    const storeTargetLabel = document.getElementById('storeTargetLabel');
                    const adminTargetEditBtn = document.getElementById('adminTargetEditBtn');

                    if (currentUser && currentUser.isAdmin) {
                        storeTargetLabel.textContent = '當日營業額目標 Daily Target';
                        storeAverageAmount.textContent = '$' + targetAmount.toLocaleString();
                        adminTargetEditBtn.style.display = 'inline-flex';
                        storeAverageBlock.style.display = 'block';
                    } else if (storeAverage) {
                        storeTargetLabel.textContent = '門市平均業績 Store Average/日';
                        storeAverageAmount.textContent = '$' + storeAverage.toLocaleString();
                        adminTargetEditBtn.style.display = 'none';
                        storeAverageBlock.style.display = 'block';
                    } else {
                        adminTargetEditBtn.style.display = 'none';
                        storeAverageBlock.style.display = 'none';
                    }
                    
                    // 儲存回報資料
                    // 伺服器成功讀回的清單才是準：本次補顯示的紀錄全部交給伺服器結果，
                    // 已刪除的 ID 也不會再從補顯示清單冒出來
                    dailyReportsData = (Array.isArray(data.reports) ? data.reports : [])
                        .filter(r => !deletedReportIds.has(String(r.id)));
                    dailyReportsLoaded = true;
                    // 伺服器已有的 ID 交給伺服器顯示；讀取開始前就已確認成功、伺服器卻沒有的，
                    // 代表已在別處被刪除，也一併移除；讀取開始後才送出的保留到下次讀取
                    const loadedIds = new Set(dailyReportsData.map(r => String(r.id)));
                    sessionSavedReports = sessionSavedReports.filter(r =>
                        !loadedIds.has(String(r.id)) && (r.savedAt || 0) > requestStartedAt
                    );
                    
                    // 更新歷史記錄顯示
                    loadHistory();
                }
            } catch (err) {
                console.log('Daily sales load error:', err);
            }
        }

        // ==================== Submit Report ====================
        // 處理送出期間鎖住 PN 與備註，避免等待結果時內容被改掉
        function setReportFormLocked(locked) {
            ['productPN', 'reportNote'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = locked;
            });
        }

        async function submitReport() {
            if (isSubmittingReport) return;

            const currentPN = document.getElementById('productPN').value.trim().toUpperCase();
            if (!selectedProduct || String(selectedProduct.pn).toUpperCase() !== currentPN) {
                clearSelectedProduct();
                alert('請先查詢產品資訊！');
                return;
            }

            // 送出當下擷取整份表單內容，之後的比對、確認與寫入都只用這一份
            const form = {
                product: { ...selectedProduct },
                note: document.getElementById('reportNote').value.trim() || '-'
            };
            const today = getTaipeiDateString();

            isSubmittingReport = true;
            setReportFormLocked(true);
            const submitBtn = document.getElementById('submitReportBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting 送出中...';
            }

            let savedReport = null;
            let alreadySavedReport = null;
            let duplicateNotice = false;
            // 最後一次寫入請求是否為重送；重送收到 400 不代表原回報沒寫入
            let lastPushWasRetry = false;
            try {
                // 上一筆送出沒收到結果時（pendingReport 還在）：
                // 同一天、同產品、同備註 → 視為重送，沿用原 ID，後端用原日期判斷是否已寫入
                // 其他情況 → 先向後端確認上一筆是否已寫入，確認清楚前不會清掉 pendingReport
                let isRetry = false;
                if (pendingReport) {
                    const previous = pendingReport;
                    const sameContent = previous.productPN === form.product.pn && previous.note === form.note;
                    if (sameContent && previous.taipeiDate === today) {
                        isRetry = true;
                    } else {
                        const check = await checkPendingReport(previous);
                        const status = check.status;
                        const label = `${previous.productPN}，${previous.taipeiDate}`;
                        if (status === 'found') {
                            if (sameContent) {
                                // 跨日又賣出同一個商品是很常見的事，不能直接當成同一筆
                                const entryDate = check.entryDate || previous.taipeiDate;
                                const isNewSale = confirm(
                                    `上一筆回報（${previous.productPN}，${entryDate}）已經送出成功。\n\n` +
                                    '目前這筆是今天另一筆新的成交嗎？\n按「確定」送出新的一筆；按「取消」表示就是上一筆，不再送。'
                                );
                                setPendingReport(null);
                                if (!isNewSale) {
                                    // 以伺服器實際入帳日期為準（午夜前送出、午夜後才入帳時會是今天）
                                    alreadySavedReport = { ...previous, taipeiDate: entryDate };
                                }
                            } else {
                                // 取消時保留 pendingReport，下次提交仍會再問
                                if (!confirm(`上一筆回報（${label}）已經送出成功。\n\n目前這筆是另一筆新的成交嗎？按「確定」送出。`)) return;
                                setPendingReport(null);
                            }
                        } else if (status === 'missing') {
                            // 後端明確查無上一筆，直接把目前這筆當成新的回報
                            setPendingReport(null);
                        } else {
                            const where = previous.taipeiDate === today
                                ? '請先到下方「今日回報記錄」確認，避免重複回報。'
                                : `原回報日期是 ${previous.taipeiDate}，今日回報記錄看不到，請先向 Admin 確認，避免重複回報。`;
                            if (!confirm(`上一筆回報（${label}）送出時沒有收到結果，現在也無法確認是否成功。\n${where}\n\n仍要把目前這筆當成新的回報送出嗎？`)) return;
                            setPendingReport(null);
                        }
                    }
                }

                if (!alreadySavedReport) {
                    const newReport = () => ({
                        id: makeReportId(),
                        taipeiDate: today,
                        date: new Date().toISOString(),
                        timestamp: new Date().toISOString(),
                        userName: currentUser.name,
                        storeName: currentUser.store,
                        productPN: form.product.pn,
                        productName: form.product.name,
                        price: form.product.price || '',
                        reward: form.product.reward || '',
                        note: form.note
                    });
                    let report = isRetry ? pendingReport : newReport();
                    setPendingReport(report);

                    let result;
                    try {
                        lastPushWasRetry = isRetry;
                        result = await pushReportToSheets(report, isRetry);
                    } catch (pushErr) {
                        // 重送時後端明確查無上一筆（含手機時鐘不準、跨午夜）→ 上一筆確定沒寫入，改用新 ID 送一次
                        if (isRetry && pushErr.status === 404 && pushErr.data && pushErr.data.status === 'not_found') {
                            report = newReport();
                            setPendingReport(report);
                            isRetry = false;
                            lastPushWasRetry = false;
                            result = await pushReportToSheets(report, false);
                        } else {
                            throw pushErr;
                        }
                    }
                    if (result && result.entryDate) report.taipeiDate = result.entryDate;
                    setPendingReport(null);
                    savedReport = report;
                    if (result && result.duplicate === true) duplicateNotice = true;
                }
            } catch (err) {
                if (err && (err.status === 400 || err.status === 422) && !lastPushWasRetry) {
                    // 伺服器明確拒絕：這筆確定沒寫入，不再保留待確認
                    setPendingReport(null);
                    const reason = err.data && err.data.error ? `（${err.data.error}）` : '';
                    alert(`回報資料不正確，這筆沒有送出${reason}。\n請登出後重新登入再試，仍不行請聯絡 Admin。`);
                } else {
                    alert('回報送出失敗，請稍後再試');
                }
                console.error('Submit report failed:', err);
            } finally {
                isSubmittingReport = false;
                setReportFormLocked(false);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit 提交回報';
                }
            }

            if (alreadySavedReport) {
                alert(`上一筆回報（${alreadySavedReport.productPN}，${alreadySavedReport.taipeiDate}）已經送出成功，不需要再送。`);
                showSubmitSuccess(alreadySavedReport);
                return;
            }
            if (savedReport) {
                if (duplicateNotice) {
                    alert('上一筆其實已經送出成功，這次沒有重複寫入。\n如果這是另一筆新的成交，請再送一次。');
                }
                showSubmitSuccess(savedReport);
            }
        }

        // 送出成功後的畫面更新；這裡的任何錯誤都不能再顯示「送出失敗」
        function showSubmitSuccess(savedReport) {
            if (savedReport) {
                try {
                    sessionSavedReports = sessionSavedReports.filter(r => r.id !== savedReport.id);
                    sessionSavedReports.unshift({ ...savedReport, savedAt: Date.now() });
                    reportHistory = reportHistory.filter(r => r && r.id !== savedReport.id);
                    reportHistory.unshift(savedReport);
                    localStorage.setItem('staffReport_history', JSON.stringify(reportHistory.slice(0, 200)));
                } catch (storageErr) {
                    console.warn('Local history save failed:', storageErr);
                }
            }

            document.getElementById('reportForm').classList.remove('active');
            document.getElementById('successResult').classList.remove('hidden');

            try {
                loadHistory();
            } catch (historyErr) {
                console.warn('History render failed:', historyErr);
            }
            loadDailySales();
        }

        // 確認「沒收到結果的上一筆」是否已寫入：found／missing／unknown
        // 只有後端明確回 status: not_found 才算 missing，其他錯誤一律 unknown
        async function checkPendingReport(report) {
            if (GOOGLE_SHEETS_CONFIG.useDemoMode) return { status: 'unknown' };
            try {
                const response = await fetch(GOOGLE_SHEETS_CONFIG.reportsUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...buildReportPayload(report, true), checkOnly: true })
                });
                const data = await response.json().catch(() => null);
                if (response.status === 404 && data && data.status === 'not_found') return { status: 'missing' };
                if (response.ok && data && data.duplicate === true) return { status: 'found', entryDate: data.entryDate };
                return { status: 'unknown' };
            } catch (err) {
                console.warn('Pending report check failed:', err);
                return { status: 'unknown' };
            }
        }

        function buildReportPayload(report, isRetry) {
            return {
                id: report.id,
                retry: Boolean(isRetry),
                reportDate: report.taipeiDate,
                name: report.userName,
                store: report.storeName,
                pn: report.productPN,
                productName: report.productName,
                price: report.price || '',
                reward: report.reward || '',
                note: report.note
            };
        }

        async function pushReportToSheets(report, isRetry) {
            if (GOOGLE_SHEETS_CONFIG.useDemoMode) {
                console.log('Demo mode - report saved locally:', report);
                return true;
            }
            
            try {
                const response = await fetch(GOOGLE_SHEETS_CONFIG.reportsUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(buildReportPayload(report, isRetry))
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    const httpErr = new Error(`HTTP ${response.status}`);
                    httpErr.status = response.status;
                    httpErr.data = data;
                    throw httpErr;
                }
                return data;
            } catch (err) {
                console.error('Failed to push report to Google Sheets:', err);
                throw err;
            }
        }
        
        function loadHistory() {
            // 優先使用 Google Sheets 的資料（dailyReportsData）；成功讀回過就以伺服器為準，空清單也一樣
            const today = getTaipeiDateString();
            const sessionToday = (currentUser && !currentUser.isAdmin ? sessionSavedReports : [])
                .filter(r => r.taipeiDate === today && !deletedReportIds.has(String(r.id)));
            if (dailyReportsLoaded || (dailyReportsData && dailyReportsData.length > 0) || sessionToday.length > 0) {
                // 本次確認送出成功、但伺服器清單還沒讀回的回報，先補在最上面（依 ID 去重）
                const serverIds = new Set(dailyReportsData.map(r => String(r.id)));
                const pendingDisplay = sessionToday
                    .filter(r => !serverIds.has(String(r.id)))
                    .map(r => ({
                        id: r.id,
                        pn: r.productPN,
                        productName: r.productName,
                        timestamp: '剛剛送出',
                        name: r.userName,
                        store: r.storeName,
                        note: r.note,
                        reward: r.reward
                    }));
                let html = '';
                [...pendingDisplay, ...dailyReportsData].forEach((r, index) => {
                    const deleteBtn = currentUser ?
                        `<button type="button" data-report-id="${escapeHtml(r.id)}" data-name="${escapeHtml(r.name)}" data-store="${escapeHtml(r.store)}" style="background:#fee2e2;border:1px solid #fecaca;color:#dc2626;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;">Delete</button>` : '';

                    html += `
                        <div class="history-item">
                            <div class="header">
                                <span class="pn">${escapeHtml(r.pn)} - ${escapeHtml(r.productName)}</span>
                                <span class="time">${escapeHtml(r.timestamp)}</span>
                            </div>
                            <div style="font-size:12px;color:#6b7280;margin:5px 0;">${escapeHtml(r.name)} | ${escapeHtml(r.store)}</div>
                            <div style="font-size:12px;color:#6b7280;margin:5px 0;">台獎：${escapeHtml(r.reward || '-')}</div>
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : '<div></div>'}
                                ${deleteBtn}
                            </div>
                        </div>
                    `;
                });
                document.getElementById('historyList').innerHTML = html ||
                    '<p style="text-align:center;color:#666;font-size:13px;">尚無回報記錄 No records yet</p>';
                return;
            }
            
            // 備用：使用本地儲存
            // 本機備援資料讀取失敗（瀏覽器封鎖儲存或資料損壞）時，沿用記憶體中的紀錄
            let stored = [];
            try {
                const raw = localStorage.getItem('staffReport_history');
                const parsed = raw ? JSON.parse(raw) : [];
                if (Array.isArray(parsed)) stored = parsed;
            } catch (storageErr) {
                console.warn('Local history read failed:', storageErr);
            }
            // 記憶體中的紀錄優先，再補上本機儲存裡還沒出現的；不是物件的項目直接略過
            const merged = [];
            const seenIds = new Set();
            [...reportHistory, ...stored].forEach(item => {
                if (!item || typeof item !== 'object' || Array.isArray(item)) return;
                const key = item.id !== undefined && item.id !== null ? String(item.id) : null;
                if (key !== null) {
                    if (deletedReportIds.has(key)) return;
                    if (seenIds.has(key)) return;
                    seenIds.add(key);
                }
                merged.push(item);
            });
            const saved = merged.length > 0 ? merged : null;
            if (saved) {
                reportHistory = saved;
                const today = new Date().toDateString();
                const visibleReports = reportHistory.filter(r => {
                    const reportStore = r.storeName || r.store || '';
                    const reportUser = r.userName || r.name || '';
                    const reportDate = r.date || r.timestamp || '';
                    const sameDate = reportDate && new Date(reportDate).toDateString() === today;
                    const sameStore = currentUser && reportStore === currentUser.store;
                    const sameUser = currentUser && reportUser === currentUser.name;

                    return currentUser && !currentUser.isAdmin && sameDate && sameStore && sameUser;
                });

                if (visibleReports.length > 0) {
                    let html = '';
                    visibleReports.forEach((r, index) => {
                        html += `
                            <div class="history-item">
                                <div class="header">
                                    <span class="pn">${escapeHtml(r.productPN || r.pn || '')} - ${escapeHtml(r.productName || r.name || '')}</span>
                                    <span class="time">${escapeHtml(r.timestamp || r.date || '')}</span>
                                </div>
                                <div style="font-size:12px;color:#888;margin:5px 0;">${escapeHtml(r.userName || r.name || '')} | ${escapeHtml(r.storeName || r.store || '')}</div>
                                <div style="font-size:12px;color:#888;margin:5px 0;">台獎：${escapeHtml(r.reward || '-')}</div>
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    ${r.note && r.note !== '-' ? `<div class="note">${escapeHtml(r.note)}</div>` : '<div></div>'}
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('historyList').innerHTML = html;
                } else {
                    document.getElementById('historyList').innerHTML = '';
                }
            } else {
                document.getElementById('historyList').innerHTML = '';
            }
        }
        
        // ==================== Reset Form ====================
        function resetForm() {
            document.getElementById('productPN').value = '';
            document.getElementById('reportNote').value = '';
            clearSelectedProduct();

            document.getElementById('successResult').classList.add('hidden');
            document.getElementById('reportForm').classList.add('active');
        }
    </script>
</body>
